const b2u=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const u2b=u=>{let s="";for(let i=0;i<u.length;i+=32768)s+=String.fromCharCode.apply(null,u.subarray(i,i+32768));return btoa(s)};
const msg=t=>document.getElementById('msg').textContent=t;
async function chiaveDa(pw){
  const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',salt:b2u(SALE),iterations:GIRI,hash:'SHA-256'},base,{name:'AES-GCM',length:256},true,['decrypt']);
}
async function apri(k){
  const chiaro=await crypto.subtle.decrypt({name:'AES-GCM',iv:b2u(IV)},k,b2u(DATI));
  const html=new TextDecoder().decode(chiaro);
  document.open();document.write(html);document.close();
}
async function sblocca(){
  const pw=document.getElementById('pw').value;
  if(!pw){msg('Scrivi la password');return}
  msg('Verifica in corso…');
  try{
    const k=await chiaveDa(pw);
    if(document.getElementById('ric').checked){
      try{localStorage.setItem('jarvisChiaveApp',SALE+'|'+u2b(new Uint8Array(await crypto.subtle.exportKey('raw',k))))}catch(e){}
    }
    await apri(k);
  }catch(e){msg('Password errata')}
}
document.getElementById('ok').onclick=sblocca;
document.getElementById('pw').addEventListener('keydown',e=>{if(e.key==='Enter')sblocca()});
(async()=>{
  if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
  let s=null;try{s=localStorage.getItem('jarvisChiaveApp')}catch(e){}
  if(s&&s.split('|')[0]===SALE){
    try{
      const k=await crypto.subtle.importKey('raw',b2u(s.split('|')[1]),{name:'AES-GCM'},false,['decrypt']);
      await apri(k);return;
    }catch(e){try{localStorage.removeItem('jarvisChiaveApp')}catch(_){}}
  }
  document.getElementById('pw').focus();
})();
</script>
